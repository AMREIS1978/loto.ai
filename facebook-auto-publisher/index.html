<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Facebook Auto Publisher</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f7fb;color:#172033}
    .wrap{max-width:760px;margin:50px auto;padding:24px}
    .card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(20,30,55,.09)}
    h1{margin:0 0 8px;font-size:30px}.muted{color:#687386}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .primary{background:#1877f2;color:white}.secondary{background:#eef3fb;color:#172033}.hidden{display:none}
    .status{margin-top:22px;padding:14px 16px;background:#f7f9fd;border-radius:12px}.version{font-size:13px;color:#687386;margin-top:16px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Facebook Auto Publisher</h1>
      <div class="muted">Publicação automática na sua Página Facebook.</div>
      <div class="status" id="status">A aplicação verifica atualizações automaticamente.</div>
      <div class="row">
        <button class="secondary" id="checkBtn">Procurar atualização</button>
        <button class="primary hidden" id="installBtn">Instalar atualização agora</button>
      </div>
      <div class="version" id="version"></div>
    </div>
  </div>
<script>
  const status = document.getElementById('status');
  const installBtn = document.getElementById('installBtn');
  const checkBtn = document.getElementById('checkBtn');

  window.desktopApp.getVersion().then(v => document.getElementById('version').textContent = `Versão ${v}`);

  checkBtn.addEventListener('click', async () => {
    status.textContent = 'A procurar uma versão nova…';
    const result = await window.desktopApp.checkForUpdates();
    if (!result.ok && result.message) status.textContent = result.message;
  });

  installBtn.addEventListener('click', () => window.desktopApp.installUpdate());

  window.desktopApp.onUpdateStatus(data => {
    if (data.type === 'checking') status.textContent = 'A procurar atualizações…';
    if (data.type === 'available') status.textContent = `Nova versão ${data.version} encontrada. A descarregar…`;
    if (data.type === 'current') status.textContent = 'Já tem a versão mais recente.';
    if (data.type === 'downloading') status.textContent = `A descarregar atualização: ${data.percent}%`;
    if (data.type === 'ready') {
      status.textContent = `Versão ${data.version} pronta. Pode instalar agora ou fechar a app para atualizar automaticamente.`;
      installBtn.classList.remove('hidden');
    }
    if (data.type === 'error') status.textContent = `Atualização: ${data.message}`;
  });
</script>
</body>
</html>
