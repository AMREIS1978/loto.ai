name: Facebook Auto Publisher - Release

on:
  push:
    tags:
      - 'facebook-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: facebook-auto-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: facebook-auto-publisher/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Publish Windows installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
